name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  portable-core-tests:
    name: Portable core tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore core tests
        run: dotnet restore ./tests/LocalCopilot.Core.Tests/LocalCopilot.Core.Tests.csproj

      - name: Run core tests
        run: >-
          dotnet test
          ./tests/LocalCopilot.Core.Tests/LocalCopilot.Core.Tests.csproj
          --configuration Release
          --no-restore
          --settings ./tests/LocalCopilot.Core.Tests/.runsettings
          --logger "trx;LogFileName=core-tests-ubuntu.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-tests-ubuntu-${{ github.run_id }}
          path: tests/LocalCopilot.Core.Tests/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 7

  windows-validation:
    name: Windows tests and win-x64 build
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse diagnostic runners with Windows PowerShell
        shell: powershell
        run: |
          $paths = @(
            (Resolve-Path .\run-debug.ps1).Path
            (Resolve-Path .\run-m3-3-acceptance.ps1).Path
            (Resolve-Path .\run-m3-4-provider-isolation.ps1).Path
            (Resolve-Path .\run-m3-4-acceptance.ps1).Path
            (Resolve-Path .\scripts\run-m3-4-provider-isolation-core.ps1).Path
            (Resolve-Path .\tests\fixtures\Test-RawUiAutomationProvider.ps1).Path
          )

          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $path,
              [ref]$tokens,
              [ref]$errors)

            if (@($errors).Count -ne 0) {
              $errors | ForEach-Object { Write-Error "${path}: $($_.Message)" }
              throw "A diagnostic entry point is not compatible with Windows PowerShell."
            }
          }

      - name: Validate physical raw-provider runner patch
        shell: powershell
        run: .\run-m3-4-provider-isolation.ps1 -ValidateOnly

      - name: Compile controlled UI Automation provider fixture
        shell: powershell
        run: |
          Add-Type -AssemblyName UIAutomationProvider
          Add-Type -AssemblyName UIAutomationTypes

          $providerAssembly =
            [System.Windows.Automation.Provider.AutomationInteropProvider].Assembly.Location
          $typesAssembly =
            [System.Windows.Automation.AutomationElementIdentifiers].Assembly.Location

          Add-Type -Path .\tests\fixtures\BlockingUiAutomationProvider.cs `
            -ReferencedAssemblies @(
              "System.Windows.Forms.dll",
              "System.Drawing.dll",
              "Accessibility.dll",
              $providerAssembly,
              $typesAssembly
            )

      - name: Smoke-test controlled raw provider across processes
        shell: powershell
        run: .\tests\fixtures\Test-RawUiAutomationProvider.ps1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore core tests
        run: dotnet restore .\tests\LocalCopilot.Core.Tests\LocalCopilot.Core.Tests.csproj

      - name: Run core tests
        run: >-
          dotnet test
          .\tests\LocalCopilot.Core.Tests\LocalCopilot.Core.Tests.csproj
          --configuration Release
          --no-restore
          --settings .\tests\LocalCopilot.Core.Tests\.runsettings
          --logger "trx;LogFileName=core-tests-windows.trx"

      - name: Restore WinUI app
        run: >-
          dotnet restore
          .\src\LocalCopilot.App\LocalCopilot.App.csproj
          --runtime win-x64

      - name: Build WinUI app
        run: >-
          dotnet build
          .\src\LocalCopilot.App\LocalCopilot.App.csproj
          --configuration Debug
          --runtime win-x64
          --no-restore
          --warnaserror

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-tests-windows-${{ github.run_id }}
          path: tests/LocalCopilot.Core.Tests/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 7
