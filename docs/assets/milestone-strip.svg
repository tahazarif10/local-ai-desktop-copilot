<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 238" role="img" aria-labelledby="title desc">
  <title id="title">Project milestone progress</title>
  <desc id="desc">M1 context and M2 sensing are complete. M2.4 foundation hardening is active. UI understanding, vision, memory, local AI, and productization are planned.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="238" gradientUnits="userSpaceOnUse">
      <stop stop-color="#091423"/>
      <stop offset="1" stop-color="#10152A"/>
    </linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <style>
      text { font-family: "Segoe UI", Inter, Arial, sans-serif; }
      .code { font-size: 17px; font-weight: 800; letter-spacing: 1.3px; }
      .name { font-size: 16px; font-weight: 650; }
    </style>
  </defs>
  <rect width="1600" height="238" rx="28" fill="url(#bg)"/>
  <text x="70" y="51" fill="#F4F8FF" font-size="24" font-weight="750">Delivery path</text>
  <text x="1530" y="49" text-anchor="end" fill="#8296B5" font-size="16" font-weight="650" letter-spacing="1.5">VERIFIED → ACTIVE → PLANNED</text>

