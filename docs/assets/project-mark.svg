<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Local AI Desktop Copilot project mark</title>
  <desc id="desc">A protected desktop window with a local intelligence pulse.</desc>
  <defs>
    <linearGradient id="bg" x1="28" y1="20" x2="225" y2="236" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10264A"/>
      <stop offset="0.52" stop-color="#0B1530"/>
      <stop offset="1" stop-color="#090E1D"/>
    </linearGradient>
    <linearGradient id="line" x1="48" y1="50" x2="207" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.52" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="shield" x1="101" y1="101" x2="157" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="8" y="8" width="240" height="240" rx="58"/>
    </clipPath>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#bg)"/>
  <g clip-path="url(#tileClip)">
    <circle cx="65" cy="60" r="34" fill="#38BDF8" opacity="0.16" filter="url(#glow)"/>
    <circle cx="193" cy="196" r="38" fill="#A78BFA" opacity="0.14" filter="url(#glow)"/>
  </g>

  <rect x="39" y="47" width="178" height="132" rx="22" fill="#091224" stroke="url(#line)" stroke-width="5"/>
  <path d="M41 76H215" stroke="#334A70" stroke-width="3"/>
  <circle cx="57" cy="62" r="4" fill="#38BDF8"/>
  <circle cx="70" cy="62" r="4" fill="#818CF8"/>
  <circle cx="83" cy="62" r="4" fill="#C084FC"/>

  <path d="M62 111H85L96 92L112 137L127 106L139 123H157" fill="none" stroke="url(#line)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="164" cy="112" r="5" fill="#38BDF8"/>
  <circle cx="181" cy="112" r="5" fill="#818CF8"/>
  <circle cx="198" cy="112" r="5" fill="#C084FC"/>

  <path d="M102 194H154" stroke="#52688C" stroke-width="7" stroke-linecap="round"/>
  <path d="M128 179V194" stroke="#52688C" stroke-width="7" stroke-linecap="round"/>

  <path d="M128 116L160 128V151C160 174 146 190 128 198C110 190 96 174 96 151V128L128 116Z" fill="#0A1B21" stroke="url(#shield)" stroke-width="5"/>
  <path d="M114 154L124 164L143 143" fill="none" stroke="#6EE7B7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
</svg>
